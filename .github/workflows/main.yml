name: Run UI and API Tests with Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
permissions:
  contents: write
  
jobs:
  typescript-playwright:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.43.1-jammy

    steps:
      - name: Install Git for report publishing
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install TypeScript Playwright dependencies
        working-directory: playwright-tests
        run: npm install

      - name: Run Playwright Tests
        working-directory: playwright-tests
        run: npx playwright test --reporter=html
        continue-on-error: true

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          # ✅ Copy report to permanent folder
      - name: Copy report to reports/latest
        run: |
          rm -rf playwright-tests/reports/latest
          mkdir -p playwright-tests/reports/latest
          cp -r playwright-tests/playwright-report/* playwright-tests/reports/latest/

      # ✅ Commit report to main branch
      - name: Commit Playwright report to repo
        env:
           GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/ProgrammingWithPradeep/qa-automation-devops-portfolio.git
          git pull origin main
          git add playwright-tests/reports/latest/
          git commit -m "Update Playwright report" || echo "No changes to commit"
          git push origin main
        continue-on-error: true

  python-pytest:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run storefront workflow tests
        run: |
          mkdir -p test-results
          python -m pytest tests -v --junitxml=test-results/python-pytest.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-report
          path: test-results/python-pytest.xml
          if-no-files-found: warn

  python-playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Create a private network and start the Storefront App container
      - name: Build and start Storefront App container
        run: |
          docker network create qa-net
          docker build -t storefront-app ./app
          docker run -d --network qa-net --name storefront storefront-app

      # 2. Run Playwright tests using the container name "storefront"
      - name: Run Python Playwright end-to-end tests
        run: |
          REG="mcr.microsoft"
          IMG="${REG}.com/playwright/python:v1.65.0-noble"
          docker run --rm --network qa-net \
            -e STOREFRONT_BASE_URL=http://storefront:8000 \
            -v "${{ github.workspace }}/playwright-python:/tests" \
            -w /tests \
            "$IMG" \
            bash -c "pip install -r requirements.txt && pytest -c pytest.ini tests -v"


      # 3. Clean up the container and network
      - name: Cleanup Docker resources
        if: always()
        run: |
          docker rm -f storefront || true
          docker network rm qa-net || true

      # 4. Upload the generated reports
      - name: Upload Python Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-playwright-report
          path: |
            playwright-python/report.html
            playwright-python/report.xml
          if-no-files-found: warn

  selenium-serenity:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-11
    steps:
      - name: Install Chromium and ChromeDriver
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium chromium-driver

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Serenity and Selenium tests
        working-directory: SeleniumSerenity
        run: |
          mvn --batch-mode test \
            -Denvironment=ci \
            -Dwebdriver.driver=chrome \
            -Dwebdriver.chrome.driver=/usr/bin/chromedriver \
            -Dchrome.capabilities.goog:chromeOptions.binary=/usr/bin/chromium \
            -Dchrome.switches="--headless=new;--no-sandbox;--disable-dev-shm-usage;--disable-gpu;--window-size=1920,1080"
      

      - name: Upload Serenity and Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-serenity-report
          path: |
            SeleniumSerenity/target/site/serenity/
            SeleniumSerenity/target/cucumber-reports.html
            SeleniumSerenity/target/cucumber.json
          if-no-files-found: warn

  api-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install API test dependencies
        run: python -m pip install requests

      - name: Run API Tests
        run: python api-tests/test-sensors.py
        continue-on-error: true
